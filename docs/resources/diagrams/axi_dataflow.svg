<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2864a5"/></marker><marker id="carrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a5b00"/></marker></defs>
<style>
.title{font: bold 24px Arial,sans-serif;fill:#172b4d} .heading{font:bold 19px Arial,sans-serif;fill:#172b4d}
.label{font:bold 15px Arial,sans-serif;fill:#172b4d} .small{font:12px Arial,sans-serif;fill:#334155}
.block{fill:#fff;stroke:#52749b;stroke-width:2} .ps{fill:#edf5ff;stroke:#6d91bd;stroke-width:2}
.pl{fill:#f0f8f1;stroke:#6c9c79;stroke-width:2} .dataArrow{fill:none;stroke:#2864a5;stroke-width:2.5;marker-end:url(#arrow)}
.controlArrow{fill:none;stroke:#9a5b00;stroke-width:2.5;marker-end:url(#carrow)} .header{fill:#dce8f5;stroke:#9aaec4}
.cell{fill:#fff;stroke:#b8c4d1}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="550" y="35" class="title" text-anchor="middle">AXI Control and Data Paths</text>
<rect x="35" y="90" width="1030" height="125" rx="15" class="ps"/><text x="550" y="120" class="heading" text-anchor="middle">PS: ARM Cortex-A9 + C application + DDR buffers</text>
<rect x="65" y="145" width="270" height="50" class="block"/><text x="200" y="175" class="label" text-anchor="middle">Control / status</text>
<rect x="415" y="145" width="270" height="50" class="block"/><text x="550" y="175" class="label" text-anchor="middle">Input/output buffers</text>
<rect x="765" y="145" width="250" height="50" class="block"/><text x="890" y="175" class="label" text-anchor="middle">DMA configuration</text>
<rect x="35" y="300" width="1030" height="170" rx="15" class="pl"/><text x="550" y="330" class="heading" text-anchor="middle">PL: Accelerator</text>
<rect x="75" y="360" width="230" height="70" class="block"/><text x="190" y="388" class="label" text-anchor="middle">AXI4-Lite slave</text><text x="190" y="410" class="small" text-anchor="middle">control registers</text>
<rect x="385" y="360" width="230" height="70" class="block"/><text x="500" y="388" class="label" text-anchor="middle">AXI DMA</text><text x="500" y="410" class="small" text-anchor="middle">MM2S / S2MM</text>
<rect x="695" y="360" width="300" height="70" class="block"/><text x="845" y="388" class="label" text-anchor="middle">AXI4-Stream datapath</text><text x="845" y="410" class="small" text-anchor="middle">input → array → output</text>
<path d="M200 195 V360" class="controlArrow"/><path d="M550 195 V260 H500 V360" class="dataArrow"/><path d="M615 395 H695" class="dataArrow"/>
<text x="550" y="495" class="small" text-anchor="middle">Conceptual: actual ports, data width, clock/reset, and stream packet format are implementation decisions.</text>

</svg>