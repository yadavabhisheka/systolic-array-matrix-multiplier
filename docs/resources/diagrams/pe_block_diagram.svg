<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2864a5"/></marker><marker id="carrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a5b00"/></marker></defs>
<style>
.title{font: bold 24px Arial,sans-serif;fill:#172b4d} .heading{font:bold 19px Arial,sans-serif;fill:#172b4d}
.label{font:bold 15px Arial,sans-serif;fill:#172b4d} .small{font:12px Arial,sans-serif;fill:#334155}
.block{fill:#fff;stroke:#52749b;stroke-width:2} .ps{fill:#edf5ff;stroke:#6d91bd;stroke-width:2}
.pl{fill:#f0f8f1;stroke:#6c9c79;stroke-width:2} .dataArrow{fill:none;stroke:#2864a5;stroke-width:2.5;marker-end:url(#arrow)}
.controlArrow{fill:none;stroke:#9a5b00;stroke-width:2.5;marker-end:url(#carrow)} .header{fill:#dce8f5;stroke:#9aaec4}
.cell{fill:#fff;stroke:#b8c4d1}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="500" y="35" class="title" text-anchor="middle">Processing Element (PE) — Conceptual Datapath</text>
<rect x="30" y="150" width="150" height="80" class="block"/><text x="105" y="182" class="label" text-anchor="middle">Activation</text><text x="105" y="204" class="small" text-anchor="middle">signed INT8</text>
<rect x="30" y="285" width="150" height="65" class="block"/><text x="105" y="312" class="label" text-anchor="middle">Weight input</text><text x="105" y="332" class="small" text-anchor="middle">load enable</text>
<rect x="240" y="275" width="160" height="85" class="block"/><text x="320" y="307" class="label" text-anchor="middle">Weight register</text><text x="320" y="330" class="small" text-anchor="middle">signed INT8</text>
<rect x="260" y="145" width="180" height="80" class="block"/><text x="350" y="177" class="label" text-anchor="middle">Multiplier</text><text x="350" y="199" class="small" text-anchor="middle">INT8 × INT8 → INT16</text>
<rect x="510" y="145" width="180" height="80" class="block"/><text x="600" y="177" class="label" text-anchor="middle">Sign extension</text><text x="600" y="199" class="small" text-anchor="middle">INT16 → INT32</text>
<rect x="760" y="145" width="200" height="80" class="block"/><text x="860" y="177" class="label" text-anchor="middle">Accumulator / adder</text><text x="860" y="199" class="small" text-anchor="middle">signed INT32</text>
<path d="M180 190 H260" class="dataArrow"/><path d="M320 275 V225" class="dataArrow"/><path d="M440 185 H510" class="dataArrow"/><path d="M690 185 H760" class="dataArrow"/>
<path d="M860 225 V300 H500 V245" class="dataArrow"/><text x="680" y="290" class="small" text-anchor="middle">partial-sum path (architecture-dependent)</text>
<text x="500" y="395" class="small" text-anchor="middle">Conceptual arithmetic only. Register placement, accumulation mode, valid timing, and forwarding must follow the frozen PE specification.</text>

</svg>